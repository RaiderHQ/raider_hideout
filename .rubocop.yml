# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# Security cops on explicitly (omakase disables cops by default).
Security/Open:
  Enabled: true
Security/Eval:
  Enabled: true
Security/YAMLLoad:
  Enabled: true
Security/MarshalLoad:
  Enabled: true
Security/JSONLoad:
  Enabled: true
Security/IoMethods:
  Enabled: true
Security/CompoundHash:
  Enabled: true
