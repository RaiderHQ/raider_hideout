# nginx in front of Raider Hideout (put in /etc/nginx/sites-enabled/).
# Bring your own certificate, e.g. from certbot.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name hideout.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name hideout.example.com;
  ssl_certificate     /etc/letsencrypt/live/hideout.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hideout.example.com/privkey.pem;

  # Uploads with screenshots and videos (Puma allows 55 MB).
  client_max_body_size 55m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Live updates use WebSockets.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
