# Raider Hideout with Docker Compose (docs/install/docker.md).
# Copy .env.example to .env next to this file, edit it, then: docker compose up -d
name: hideout

services:
  web:
    # HIDEOUT_VERSION in .env pins a release (recommended); unset follows the latest one.
    image: ghcr.io/raiderhq/hideout:${HIDEOUT_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SOLID_QUEUE_IN_PUMA: "1"
    ports:
      # Only this machine can reach the port: put a TLS proxy on the same host in
      # front (deploy/proxy/). Remove "127.0.0.1:" only behind a firewall you trust.
      - "127.0.0.1:${HIDEOUT_PORT:-3000}:3000"
    volumes:
      - hideout_storage:/rails/storage
    # depends_on: [ db ]

  # Optional Postgres for the primary database. Uncomment this service, the
  # depends_on line above and the volume below, then set in .env:
  #   DB_ADAPTER=postgresql
  #   DATABASE_URL=postgres://hideout:change-me@db/hideout
  # db:
  #   image: postgres:17
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: hideout
  #     POSTGRES_PASSWORD: change-me
  #     POSTGRES_DB: hideout
  #   volumes:
  #     - hideout_postgres:/var/lib/postgresql/data

volumes:
  hideout_storage:
  # hideout_postgres:
